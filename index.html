<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTBK Prep - Platform Latihan UTBK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>UTBK PREP</h1>
        <p>Platform Latihan UTBK</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Selamat Datang di UTBK Prep!</h2>
            <p>Persiapkan dirimu menghadapi UTBK dengan latihan soal.</p>
            <button id="startButton">Mulai Belajar</button>
        </section>

        <section id="quizSection" class="quiz-section">
            <h2>Latihan Soal</h2>
            <p id="question">Klik tombol mulai untuk memulai latihan.</p>
            <div id="answerButtons"></div>
            <button id="nextButton" hidden>Soal Berikutnya</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 UTBK Prep</p>
    </footer>

    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>
</html>
